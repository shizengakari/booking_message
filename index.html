<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージ予約 - Discord</title>
  <meta name="theme-color" content="#1e1f22">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('theme');
        var l = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (s === 'light' || (!s && l)) {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261016_v4">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <h1>メッセージ予約</h1>
        <span id="channel-badge" class="badge" style="display: none;">#<span id="channel-name"></span></span>
      </div>
      <div class="header-tools">
        <button id="btn-theme" class="icon-btn" title="テーマ切り替え" aria-label="テーマ切り替え">
          <span id="theme-icon">🌙</span>
        </button>
        <button id="btn-import-open" class="btn btn-sm">コード/ファイル読込</button>
        <button id="btn-reset" class="btn btn-sm btn-ghost">リセット</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-layout">
      <!-- Form Column -->
      <section class="form-col">
        <!-- 1. 送信日時 & 繰り返し -->
        <div class="card">
          <div class="card-head">
            <h2>1. 送信日時</h2>
          </div>
          <div class="row">
            <div class="field">
              <label for="input-date">日付</label>
              <input type="date" id="input-date" required>
            </div>
            <div class="field">
              <label for="input-time">時刻 (JST)</label>
              <input type="time" id="input-time" required>
            </div>
          </div>
          <div class="field mt-3">
            <label for="select-recurrence">繰り返し</label>
            <select id="select-recurrence">
              <option value="none">1回のみ (繰り返しなし)</option>
              <option value="daily">毎日</option>
              <option value="weekdays">平日 (月〜金)</option>
              <option value="weekly">毎週 (指定曜日)</option>
              <option value="monthly">毎月 (指定日)</option>
            </select>
          </div>
          <div id="weekly-days-group" class="field mt-2" style="display: none;">
            <label>送信する曜日</label>
            <div class="weekdays-select">
              <label><input type="checkbox" name="weekday" value="0">月</label>
              <label><input type="checkbox" name="weekday" value="1">火</label>
              <label><input type="checkbox" name="weekday" value="2">水</label>
              <label><input type="checkbox" name="weekday" value="3">木</label>
              <label><input type="checkbox" name="weekday" value="4">金</label>
              <label><input type="checkbox" name="weekday" value="5">土</label>
              <label><input type="checkbox" name="weekday" value="6">日</label>
            </div>
          </div>
          <div id="schedule-summary" class="schedule-summary"></div>
        </div>

        <!-- 2. メッセージ設定 -->
        <div class="card">
          <div class="card-head flex-between">
            <h2>2. メッセージ内容</h2>
            <div class="type-switch">
              <button type="button" class="type-btn active" data-type="embed">Embed</button>
              <button type="button" class="type-btn" data-type="plain">通常テキスト</button>
            </div>
          </div>

          <!-- Embed Form -->
          <div id="form-embed">
            <div class="field">
              <label for="embed-title">タイトル (任意)</label>
              <input type="text" id="embed-title" placeholder="タイトルを入力" maxlength="256">
            </div>
            <div class="field mt-3">
              <label for="embed-desc">説明文 / 本文 (Markdown対応)</label>
              <textarea id="embed-desc" rows="6" placeholder="本文を入力してください..." maxlength="4096"></textarea>
            </div>
            <div class="row mt-3">
              <div class="field">
                <label for="embed-color">アクセントカラー</label>
                <div class="color-picker-row">
                  <input type="color" id="embed-color" value="#5865F2">
                  <span id="embed-color-text" class="color-code">#5865F2</span>
                </div>
              </div>
              <div class="field">
                <label for="embed-image">画像URL (任意)</label>
                <input type="url" id="embed-image" placeholder="https://example.com/image.png">
              </div>
            </div>

            <!-- Optional Embed Options (Collapsible) -->
            <details class="accordion mt-3">
              <summary>詳細設定 (作成者 / サムネイル / フッター / フィールド)</summary>
              <div class="accordion-body">
                <div class="field">
                  <label for="embed-author-name">作成者名</label>
                  <input type="text" id="embed-author-name" placeholder="Author name" maxlength="256">
                </div>
                <div class="row mt-2">
                  <div class="field">
                    <label for="embed-author-icon">作成者アイコンURL</label>
                    <input type="url" id="embed-author-icon" placeholder="https://...">
                  </div>
                  <div class="field">
                    <label for="embed-thumbnail">サムネイル画像URL</label>
                    <input type="url" id="embed-thumbnail" placeholder="https://...">
                  </div>
                </div>
                <div class="row mt-2">
                  <div class="field">
                    <label for="embed-footer">フッターテキスト</label>
                    <input type="text" id="embed-footer" placeholder="Footer text" maxlength="2048">
                  </div>
                  <div class="field">
                    <label for="embed-footer-icon">フッターアイコンURL</label>
                    <input type="url" id="embed-footer-icon" placeholder="https://...">
                  </div>
                </div>

                <!-- Custom Fields -->
                <div class="mt-3">
                  <div class="flex-between">
                    <label>フィールド (項目)</label>
                    <button type="button" id="btn-add-field" class="btn btn-sm btn-ghost">+ 項目追加</button>
                  </div>
                  <div id="fields-container" class="fields-list mt-2"></div>
                </div>
              </div>
            </details>
          </div>

          <!-- Plain Form -->
          <div id="form-plain" style="display: none;">
            <div class="field">
              <div class="flex-between">
                <label for="plain-text">メッセージ本文</label>
                <span id="plain-char-count" class="char-count">0 / 2000</span>
              </div>
              <textarea id="plain-text" rows="8" placeholder="メッセージを入力してください..." maxlength="2000"></textarea>
            </div>
            <div class="field mt-3">
              <label for="plain-image">画像URL (任意)</label>
              <input type="url" id="plain-image" placeholder="https://example.com/image.png">
            </div>
          </div>

          <!-- Link Buttons Section -->
          <div class="buttons-section mt-4">
            <div class="flex-between">
              <label>リンクボタン (最大5個)</label>
              <button type="button" id="btn-add-button" class="btn btn-sm btn-ghost">+ ボタン追加</button>
            </div>
            <div id="buttons-container" class="buttons-list mt-2"></div>
          </div>
        </div>

        <!-- 3. 保存・コード発行 -->
        <div class="card action-card">
          <div class="action-buttons">
            <button type="button" id="btn-copy-code" class="btn btn-primary btn-lg">
              <span class="btn-icon">📋</span> 予約コードをコピー
            </button>
            <div class="sub-actions">
              <button type="button" id="btn-download-rsv" class="btn btn-secondary">
                💾 圧縮ファイル保存 (.rsv)
              </button>
              <button type="button" id="btn-download-json" class="btn btn-ghost">
                .json保存
              </button>
            </div>
          </div>
          <p class="action-hint">
            Discordで <code>/booking_message</code> を実行し、「予約コードを入力」に貼り付けるか、保存ファイルを添付してください。
          </p>
        </div>
      </section>

      <!-- Preview Column -->
      <section class="preview-col">
        <div class="preview-sticky">
          <div class="preview-label">Discord プレビュー</div>
          <div class="discord-preview-box">
            <div class="discord-msg">
              <div class="discord-avatar">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff">
                  <path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09-.01-.02-.04-.03-.07-.03-1.5.26-2.93.71-4.27 1.33-.01 0-.02.01-.03.02-2.72 4.07-3.47 8.03-3.1 11.95 0 .02.01.04.03.05 1.8 1.32 3.53 2.12 5.24 2.65.03.01.06 0 .07-.02.4-.55.76-1.13 1.07-1.74.02-.04 0-.08-.04-.09-.57-.22-1.11-.48-1.64-.78-.04-.02-.04-.08-.01-.11.11-.08.22-.17.33-.25.02-.02.05-.02.07-.01 3.44 1.57 7.15 1.57 10.55 0 .02-.01.05-.01.07.01.11.09.22.17.33.26.04.03.04.09-.01.11-.52.31-1.07.56-1.64.78-.04.01-.05.06-.04.09.32.61.68 1.19 1.07 1.74.02.02.04.03.07.02 1.72-.53 3.45-1.33 5.25-2.65.02-.01.03-.03.03-.05.44-4.53-.73-8.46-3.1-11.95-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/>
                </svg>
              </div>
              <div class="discord-body">
                <div class="discord-meta">
                  <span class="discord-name">Bot</span>
                  <span class="discord-badge">BOT</span>
                  <span id="pv-time" class="discord-time">今日 12:00</span>
                </div>
                
                <!-- Plain Text Preview -->
                <div id="pv-plain" style="display: none;">
                  <div id="pv-plain-text" class="pv-text"></div>
                  <img id="pv-plain-image" class="pv-image" style="display: none;" alt="">
                </div>

                <!-- Embed Preview -->
                <div id="pv-embed" class="discord-embed">
                  <div id="pv-embed-pill" class="embed-pill"></div>
                  <div class="embed-inner">
                    <div id="pv-embed-author" class="pv-author" style="display: none;">
                      <img id="pv-author-icon" class="pv-author-icon" src="" alt="">
                      <span id="pv-author-name" class="pv-author-name"></span>
                    </div>
                    <div id="pv-embed-title" class="pv-title" style="display: none;"></div>
                    <div id="pv-embed-desc" class="pv-desc">メッセージを入力するとプレビューされます</div>
                    <div id="pv-embed-fields" class="pv-fields"></div>
                    <img id="pv-embed-image" class="pv-image" style="display: none;" alt="">
                    <div id="pv-embed-footer" class="pv-footer" style="display: none;">
                      <img id="pv-footer-icon" class="pv-footer-icon" src="" alt="">
                      <span id="pv-footer-text"></span>
                    </div>
                  </div>
                  <img id="pv-embed-thumbnail" class="pv-thumbnail" style="display: none;" alt="">
                </div>

                <!-- Buttons Preview -->
                <div id="pv-buttons" class="pv-buttons" style="display: none;"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Import Modal -->
    <div id="modal-import" class="modal-overlay" style="display: none;">
      <div class="modal">
        <div class="modal-head">
          <h3>コード / ファイル読み込み</h3>
          <button type="button" id="btn-import-close" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="import-file">予約ファイル (.rsv / .json)</label>
            <input type="file" id="import-file" accept=".json,.rsv,application/json">
          </div>
          <div class="field mt-3">
            <label for="import-code">または 予約コード貼り付け</label>
            <textarea id="import-code" rows="4" placeholder="RSV1_... または JSON"></textarea>
          </div>
          <div id="import-error" class="error-msg" style="display: none;"></div>
        </div>
        <div class="modal-foot">
          <button type="button" id="btn-import-cancel" class="btn btn-ghost">キャンセル</button>
          <button type="button" id="btn-import-submit" class="btn btn-primary">読み込む</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" style="display: none;"></div>
  </div>

  <script src="app.js?v=20261016_v4"></script>
</body>
</html>
